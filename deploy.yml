# Deploy the V2 site to GitHub Pages.
#
# When you are ready to switch y-mhiri.github.io to V2:
#   1. Copy this file to .github/workflows/deploy.yml at the root of the
#      y-mhiri.github.io repository, together with the V2 project files
#      (see README.md, "Going live").
#   2. In the repository settings: Settings > Pages > Source = GitHub Actions.
#
# On every push to main the site is rebuilt: publications are re-fetched
# from HAL, so new deposits appear on the site without any manual work.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (fetches publications from HAL)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
